plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// LibGui from GitHub release assets: https://github.com/CottonMC/LibGui/releases
	exclusiveContent {
		forRepository {
			ivy {
				name = 'LibGui GitHub releases'
				url = uri("https://github.com/CottonMC/LibGui/releases/download/${project.libgui_github_release_tag}/")
				patternLayout {
					artifact('LibGui-[revision].jar')
				}
				metadataSources {
					artifact()
				}
			}
		}
		filter {
			includeModule('io.github.cottonmc', 'LibGui')
		}
	}
	mavenLocal()
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ironchest" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "io.github.cottonmc:LibGui:${project.libgui_version}"
	include "io.github.cottonmc:LibGui:${project.libgui_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
